<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FICSIT - Index of {{PATH}}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
        }
        .container { max-width: 860px; width: 90%; padding: 0 20px 60px; }
        .ficsit-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 2px solid #fa9414;
            padding-bottom: 16px;
        }
        .ficsit-logo { font-size: 28px; font-weight: 900; color: #fa9414; letter-spacing: 4px; text-transform: uppercase; }
        .ficsit-tagline { font-size: 11px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
        h1 { color: #fa9414; border-bottom: 2px solid #fa9414; padding-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }
        .path-bar {
            background: #333;
            border-left: 5px solid #fa9414;
            padding: 10px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #888;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }
        .path-bar span { color: #fa9414; }
        .separator { width: 40px; height: 3px; background: #fa9414; margin: 0 0 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        thead tr { border-bottom: 1px solid #fa9414; }
        th {
            text-align: left;
            padding: 10px 14px;
            color: #fa9414;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        td {
            padding: 10px 14px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
            color: #ccc;
        }
        tbody tr:hover { background: #222; }
        a { color: #fa9414; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .type-badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 3px;
        }
        .type-dir { background: #2a2210; color: #fa9414; border: 1px solid #fa9414; }
        .type-file { background: #1a2a1a; color: #6a6; border: 1px solid #3a5a3a; }
        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 1px solid #2a2a2a;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ficsit-header">
            <div>
                <div class="ficsit-logo">FICSIT Inc.</div>
                <div class="ficsit-tagline">Remote Directory Explorer — Automated File System</div>
            </div>
        </div>

        <h1>Directory Listing</h1>
        <div class="separator"></div>

        <div class="path-bar">PATH: <span>{{PATH}}</span></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody>
                {{CONTENT}}
            </tbody>
        </table>

        <div class="footer">FICSIT Inc. — Property of FICSIT. Comply or be terminated.</div>
    </div>
</body>
</html>
